name: Sync Medium essays

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-medium
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync from Medium RSS
        env:
          MEDIUM_RSS_URL: https://medium.com/feed/@s-acharya
          SITE_URL: https://www.sacharya.net
        run: node scripts/sync-medium.mjs